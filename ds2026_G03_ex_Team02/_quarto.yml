project:
  type: book
  output-dir: docs

book:
  title: "长鑫科技合理估值分析"
  reader-mode: true
  author: "ds2026_G03_ex_Team02"
  date: today
  date-format: iso

  sidebar:
    title: "长鑫估值研究"
    style: floating
    search: true
    tools:
      - icon: github
        href: https://github.com/ganlijie-code/ds2026_G03_ex_Team02

  site-url: https://ganlijie-code.github.io/ds2026_G03_ex_Team02/
  editor: source

  chapters:
    - index.qmd

    - part: "**摘要与导读**"
      chapters:
        - body/00_abstract.md
        - body/09_project_readme.md

    - part: "**研究报告（Notebook）**"
      chapters:
        - body/01_研究背景与数据下载.ipynb
        - body/02_数据清洗与统计事实.ipynb
        - body/03_结论局限与进阶分析.ipynb
        - body/04_进阶回归与预测分析.ipynb

    - part: "**分析输出**"
      chapters:
        - body/05_summary_stats.md
        - body/06_section7_conclusions.md
        - body/07_section7_data_sources.md
        - body/08_figures.md

    - part: "**部署说明**"
      chapters:
        - body/10_github_pages.md

format:
  html:
    toc: true
    toc-depth: 3
    theme: cosmo
    linestretch: 1.6
    fontsize: 11.5pt
    number-sections: true
    link-external-newwindow: true
    highlight: true
    highlight-style: atom-one
    code-fold: false
    code-line-numbers: false
    code-overflow: wrap
    css: styles.css
    callout-appearance: default
    md-extensions:
      - callout

execute:
  enabled: false
  echo: true
  warning: false
  message: false

editor: visual
