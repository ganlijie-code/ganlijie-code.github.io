project:
  type: book
  output-dir: _book

website:
  title: "长鑫科技 Pre-IPO 估值研究"
  site-url: https://ganlijie-code.github.io/ds2026_G03_ex_Team02/
  repo-url: https://github.com/ganlijie-code/ganlijie-code.github.io
  repo-branch: main

book:
  title: "长鑫科技 Pre-IPO 估值研究"
  subtitle: "基于公开数据的经济分析与量化验证"
  author: "DS 研究项目组"
  date: today
  chapters:
    - index.qmd
    - chapters/chapter01.qmd
    - chapters/chapter02.qmd
    - chapters/chapter03.qmd
    - chapters/chapter04.qmd
    - chapters/chapter05.qmd
    - chapters/chapter06.qmd
    - chapters/chapter07.qmd
  appendices:
    - chapters/appendix-reproduce.qmd

bibliography: references.bib

lang: zh-CN

format:
  html:
    theme:
      - cosmo
      - styles/custom.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    fig-width: 9
    fig-height: 5.0625
    fig-dpi: 150
  pdf:
    documentclass: ctexart
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.8cm
      - right=2.8cm
    toc: true
    number-sections: true
    fig-width: 6.5
    fig-height: 3.66
    fig-pos: "H"
  epub:
    toc: true

execute:
  freeze: auto
  echo: false
  warning: false
